# render.yaml — Digital Udhaar Khata Full-Stack Cloud Blueprint
services:
  # 1. React + Vite Frontend (Static Site on Global CDN)
  - type: web
    name: digital-udhaar-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://digital-udhaar-backend.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://digital-udhaar-backend.onrender.com

  # 2. Node.js + Express + Socket.io Real-Time Backend
  - type: web
    name: digital-udhaar-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
      - key: JWT_SECRET
        value: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
      - key: JWT_EXPIRATION_MS
        value: "86400000"
      - key: SMS_PROVIDER
        value: SIMULATED
