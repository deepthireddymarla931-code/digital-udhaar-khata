# Digital Udhaar Khata - Spring Boot Configuration

server.port=8080
server.servlet.context-path=/api/v1

# Database Configuration
# Defaults to MySQL on localhost:3306 (udhaar_db) matching schema.sql and .env.
# Can be overridden via DB_URL / DB_HOST / DB_PORT / DB_NAME / DB_USER / DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:udhaar_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI Integration Configuration (OpenAI / Gemini API)
ai.openai.api-url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.openai.api-key=${AI_API_KEY:mock_key}
ai.openai.model=${AI_MODEL:gpt-3.5-turbo}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.digitaludhaar=DEBUG
